<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Bansi Fashion - Industrial Worker Extra Work, Production & Salary Management System." />
    <link rel="manifest" href="/manifest.json" />
    <title>Bansi Fashion — Worker & Production App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="dns-prefetch" href="https://bansi-fashion.onrender.com">
    <link rel="preconnect" href="https://bansi-fashion.onrender.com" crossorigin>
    <script>
      // Instantly wake up the Render cloud server the millisecond HTML arrives
      try {
        fetch('https://bansi-fashion.onrender.com/api/health', { mode: 'cors' }).catch(function(){});
      } catch (e) {}
    </script>
  </head>
  <body style="margin: 0; padding: 0; background: #ffffff;">
    <div id="root">
      <div id="bf-instant-splash" style="position: fixed; inset: 0; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0f172a; z-index: 999999;">
        <div style="width: 74px; height: 74px; border-radius: 20px; background: linear-gradient(135deg, #4338ca 0%, #6366f1 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(67, 56, 202, 0.25); margin-bottom: 1.25rem;">
          <span style="font-size: 2rem; font-weight: 900; letter-spacing: -1px; color: #ffffff;">BF</span>
        </div>
        <div style="font-size: 1.35rem; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 0.35rem; color: #0f172a;">Bansi Fashion</div>
        <div style="font-size: 0.78rem; color: #64748b; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;">Industrial Work Portal</div>
        <div style="margin-top: 2rem; display: flex; gap: 7px;">
          <span style="width: 8px; height: 8px; background: #4338ca; border-radius: 50%; display: inline-block; animation: bfDot 1.2s infinite ease-in-out;"></span>
          <span style="width: 8px; height: 8px; background: #4338ca; border-radius: 50%; display: inline-block; animation: bfDot 1.2s infinite ease-in-out 0.2s;"></span>
          <span style="width: 8px; height: 8px; background: #4338ca; border-radius: 50%; display: inline-block; animation: bfDot 1.2s infinite ease-in-out 0.4s;"></span>
        </div>
        <style>
          @keyframes bfDot {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1.15); opacity: 1; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
